<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cross-sell no carrinho (GEN-105) — Praso</title>
  <link rel="stylesheet" href="../../ds/tokens.css">
  <link rel="stylesheet" href="../../ds/components.css">
  <style>
    /* GEN-105 · posição do cross-sell no carrinho: topo, final e rodapé (+ controle). Prefixo .x- */
    .x-cs { background: #e8effd; padding: 14px 0 6px; }
    .x-cs .ps-boxcard__title-blue { padding: 0 var(--page-x); margin: 0 0 10px; font-size: 13px; }
    .x-cs .ps-rail { padding-bottom: 8px; }
    .x-cs--top, .x-cs--end { margin: 8px var(--page-x); border-radius: 14px; overflow: hidden; }
    .x-cs--top { padding-top: 12px; }
    .x-cs--top .ps-boxcard__title-blue { margin-bottom: 6px; }
    .x-cs--top .ps-card__media { height: 92px; }
    .x-cs--top .ps-card__media > img { padding: 4px 24px 22px; }
    .x-cs--top .ps-card__action { transform: scale(.75); transform-origin: bottom right; }
    .x-cs--top .ps-card__sponsored { display: none; }
    .x-cs--foot { padding: 10px 0 0; border-bottom: 1px solid #d3dffa; }
    .x-cs--foot .ps-boxcard__title-blue { margin-bottom: 6px; font-size: 12px; }
    .x-cs--foot .ps-rail { gap: 8px; padding-bottom: 8px; }
    .x-cs--foot .ps-card--sm { width: 172px; display: grid; grid-template-columns: 56px 1fr; column-gap: 8px; align-items: center; background: #fff; border-radius: 10px; padding: 6px; }
    .x-cs--foot .ps-card__media { height: 56px; width: 56px; position: relative; }
    .x-cs--foot .ps-card__media > img { padding: 0; }
    .x-cs--foot .ps-card__fav, .x-cs--foot .ps-tag, .x-cs--foot .ps-card__sponsored, .x-cs--foot .ps-expiry { display: none; }
    .x-cs--foot .ps-card__body { padding: 0; min-width: 0; }
    .x-cs--foot .ps-card__name { font-size: 10px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .x-cs--foot .ps-card__action { right: -2px; bottom: -4px; transform: scale(.55); transform-origin: bottom right; }
    .x-free { padding: 10px var(--page-x) 0; background: #fff; font-size: 12px; color: #030712; }
    .x-free b { font-weight: 700; }
    .x-free__bar { height: 6px; margin: 6px 0 4px; border-radius: 3px; background: #e5e7eb; overflow: hidden; }
    .x-free__bar i { display: block; height: 100%; background: #16a34a; border-radius: 3px; }
    .x-cs--foot .ps-price s { display: none; }
    .x-foot .ps-checkout { padding-top: 8px; }
    .x-arms { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(3, 7, 18, .78); }
    .x-arms a { padding: 3px 8px; border-radius: 999px; color: #fff; font-size: 10px; font-weight: 600; text-decoration: none; opacity: .7; }
    .x-arms a.is-on { background: #fff; color: #030712; opacity: 1; }
    .ps-is-device .x-arms { top: max(4px, env(safe-area-inset-top)); }
    /* Embed (Notion etc.): tela de celular 393x852 centralizada e escalada para caber no iframe */
    html.x-embed, html.x-embed body { height: 100%; margin: 0; overflow: hidden; background: #e9ebef; }
    html.x-embed .ps-app { position: absolute; left: 50%; top: 50%; width: 393px; height: 852px; max-width: none; border-radius: 28px; transform-origin: center; box-shadow: 0 0 0 6px #111, 0 12px 30px rgba(0,0,0,.25); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="../../ds/data/catalog.js"></script>
  <script src="../../ds/praso.js"></script>
  <script src="../../ds/screens.js"></script>
  <script>
    const { ui, icon } = Praso;
    const brl = Praso.fmt.brl;
    const qs = new URLSearchParams(location.search);
    /* controle = cross-sell no meio da lista (como hoje) · a = topo · b = final dos itens · c = rodapé */
    const ARMS = { controle: 'Controle', a: 'A · Topo', b: 'B · Final', c: 'C · Rodapé' };
    const braco = Object.keys(ARMS).includes(qs.get('braco')) ? qs.get('braco') : 'a';
    const FREE_AT = 800; /* meta ilustrativa de taxa de serviço grátis */

    const IDS = ['mostarda-cepera', 'agua-sanitaria-olimpo', 'oleo-soya', 'margarina-medalha', 'farinha-finna', 'linguica-defumada-seara'];
    const TITLE = 'Quem comprou os seus produtos também levou';

    /* mesmo conteúdo e mesma distribuição do bloco atual; só muda a posição e o fundo */
    const plain = () => `<section class="ps-section ps-section--boxed"><div class="ps-boxcard">
        <h2 class="ps-boxcard__title-blue">${TITLE}</h2>${ui.productRail(IDS, { size: 'sm' })}</div></section>`;
    const blue = (mod) => `<section class="x-cs x-cs--${mod}"><h2 class="ps-boxcard__title-blue">${TITLE}</h2>${ui.productRail(IDS, { size: 'sm' })}</section>`;

    const freeBar = (total) => {
      const miss = FREE_AT - total;
      return `<div class="x-free">${miss > 0 ? `Compre mais <b>${brl(miss)}</b> para taxa de serviço grátis!` : '<b>Taxa de serviço grátis!</b>'}
        <div class="x-free__bar"><i style="width:${Math.min(100, (total / FREE_AT) * 100)}%"></i></div></div>`;
    };

    const carrinho = () => {
      const lines = Praso.cart.lines();
      if (!lines.length) return Praso.screens.carrinho();
      const trash = `<button class="ps-iconbtn ps-iconbtn--soft" data-action="clear-cart" aria-label="Esvaziar carrinho">${icon('trash', { size: 22, sw: 1.6 })}</button>`;
      const total = Praso.cart.total();
      const rows = lines.map(ui.cartLine);
      const list = (a) => `<div class="ps-cartlist">${a.join('')}</div>`;
      let body;
      if (braco === 'controle') body = list(rows.slice(0, 2)) + plain() + list(rows.slice(2));
      else if (braco === 'a') body = blue('top') + list(rows);
      else body = list(rows) + (braco === 'b' ? blue('end') : '');
      const checkout = ui.checkoutBar({ total, count: lines.length });
      const footer = braco === 'c'
        ? `<div class="x-foot">${blue('foot')}${checkout}</div>`
        : `<div class="x-foot">${freeBar(total)}${checkout}</div>`;
      return {
        tab: 'carrinho',
        header: ui.navHeader({ title: 'Carrinho', action: trash }),
        body: body + '<div class="ps-bottom-space--sm"></div>',
        footer,
      };
    };

    Praso.app({
      initial: 'carrinho',
      cart: { 'leite-natville': 3, 'redbull-summer': 1, 'qualimax-uva': 1, 'cafe-uniao': 1, 'kitkat': 1, 'chanty-amelia': 2, 'farinha-panko': 1 },
      screens: { carrinho },
    });

    document.getElementById('app').insertAdjacentHTML('beforeend',
      `<nav class="x-arms" aria-label="Posição do cross-sell">${Object.entries(ARMS).map(([a, n]) =>
        `<a class="${a === braco ? 'is-on' : ''}" href="?braco=${a}#/carrinho">${n}</a>`).join('')}</nav>`);

    (function () {
      if (window.self === window.top) return;
      if (Math.abs(innerWidth - 393) < 3 && Math.abs(innerHeight - 852) < 3) return; /* playground: já é a moldura do celular */
      const h = document.documentElement;
      h.classList.add('x-embed');
      const fit = () => {
        const k = Math.min((innerWidth - 24) / 393, (innerHeight - 24) / 852, 1);
        const app = document.querySelector('.ps-app');
        if (app) app.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
      };
      addEventListener('resize', fit); fit(); setTimeout(fit, 100);
    })();
  </script>
</body>
</html>
