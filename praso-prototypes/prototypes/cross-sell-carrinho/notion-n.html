  --fs-10: 10px;
  --fs-11: 11px;
  --fs-12: 12px;

  --fw-bold: 700;

/* No celular de verdade: sem status bar fake, respeita safe areas */

/* ------------------------------------------------------------------ STATUS BAR */

   - Praso.icon()  ícones SVG

   - Praso.ui.*    componentes (retornam strings HTML)

   Sem build, sem dependências: funciona abrindo o arquivo no navegador.
   ========================================================================== */
(function () {
  const P = (window.Praso = window.Praso || {});
  const script = document.currentScript;
  P.base = script ? script.src.replace(/praso\.js(\?.*)?$/, '') : '../../ds/';
  P.asset = (path) => P.base + 'assets/' + path;
  P.productImg = (p) => P.asset('products/' + p.img);

  /* ---------------------------------------------------------------- utils */
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  P.esc = esc;

    brl: (v) => 'R$' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),

  /* ---------------------------------------------------------------- cart */
  const listeners = new Set();
  P.cart = {
    items: {},
    favs: new Set(['redbull-summer', 'qualimax-uva', 'picanha-teys']),
    qty(id) { return this.items[id] || 0; },
    set(id, q) {
      if (q <= 0) delete this.items[id]; else this.items[id] = q;
      listeners.forEach((fn) => fn(id));
    },
    add(id) { this.set(id, this.qty(id) + 1); },
    dec(id) { this.set(id, this.qty(id) - 1); },
    clear() { this.items = {}; listeners.forEach((fn) => fn(null)); },
    count() { return Object.keys(this.items).length; },
    lines() {
      return Object.entries(this.items).map(([id, q]) => {
        const p = P.product(id);
        return { p, q, total: P.lineUnitPrice(p) * q, strike: p.strike ? p.strike * q : null };
      });
    },
    total() { return this.lines().reduce((s, l) => s + l.total, 0); },
    toggleFav(id) { this.favs.has(id) ? this.favs.delete(id) : this.favs.add(id); listeners.forEach((fn) => fn(id)); },

  };

  /* ================================================================ UI */
  const ui = (P.ui = {});

  /* Barra de status do iOS (só aparece no frame / desktop) */
  ui.statusBar = ({ time = '09:17', battery = 74, dark = false } = {}) => `
    <div class="ps-statusbar ${dark ? 'is-dark' : ''}">
      <span class="ps-statusbar__time">${time}</span>
      <span class="ps-statusbar__island"></span>
      <span class="ps-statusbar__right">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".7" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx=".7" fill="currentColor" opacity=".35"/><rect x="15" y="0" width="3" height="12" rx=".7" fill="currentColor" opacity=".35"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2A10.5 10.5 0 0 0 8.5.6 10.5 10.5 0 0 0 1 3.6l1.2 1.2a9 9 0 0 1 6.3-2.5Zm0 3.4c1.5 0 2.9.6 4 1.6l1.2-1.2a7.3 7.3 0 0 0-10.4 0l1.2 1.2c1.1-1 2.5-1.6 4-1.6Zm0 3.4c.6 0 1.2.2 1.6.6L8.5 11.3 6.9 9.7c.4-.4 1-.6 1.6-.6Z" fill="currentColor"/></svg>
        <span class="ps-battery"><span>${battery}</span></span>
      </span>
    </div>`;

  /* Barra de busca (pill cinza) */
  ui.search = ({ placeholder = 'Pesquisar na Praso', value = '', href = '#/busca' } = {}) => `
    <a class="ps-search" href="${href}">
      ${P.icon('search', { size: 17, sw: 2.6 })}
      <span class="${value ? 'ps-search__value' : 'ps-search__ph'}">${esc(value || placeholder)}</span>
    </a>`;

  /* Cabeçalho de tela com título centralizado e ação opcional */
  ui.navHeader = ({ title, back = false, action = '' }) => `
    <header class="ps-navheader">
      <span class="ps-navheader__side">${back ? `<button class="ps-iconbtn" data-action="back">${P.icon('chevron-left', { size: 22 })}</button>` : ''}</span>
      <h1 class="ps-navheader__title">${esc(title)}</h1>
      <span class="ps-navheader__side ps-navheader__side--end">${action}</span>
    </header>`;

  /* Carrossel de banners com indicadores em barra */
  ui.heroCarousel = ({ banners = P.banners.hero, active = 1, count = 10 } = {}) => {
    const b = banners[0];
    const dots = Array.from({ length: count }, (_, i) =>
      `<span class="ps-hero__dot ${i < active ? 'is-done' : ''} ${i === active ? 'is-active' : ''}"></span>`).join('');
    return `<div class="ps-hero" style="background:${b.bg}">
      <img src="${P.asset('banners/' + b.img)}" alt="${esc(b.alt || '')}">
      <div class="ps-hero__dots">${dots}</div>
    </div>`;
  };

  /* Banner de imagem (largura total, cantos arredondados) */
  ui.banner = ({ img, alt = '', flushBottom = false }) =>
    `<div class="ps-banner ${flushBottom ? 'ps-banner--flush' : ''}"><img src="${P.asset('banners/' + img)}" alt="${esc(alt)}"></div>`;

  /* Cabeçalho de seção: "Ofertas da semana ........ Ver todas" */
  ui.sectionHeader = ({ title, link = 'Ver todos', href = '#', subtitle = '', icon = '' }) => `
    <div class="ps-sechead">
      <h2 class="ps-sechead__title">${esc(title)}</h2>
      ${link ? `<a class="ps-sechead__link" href="${href}">${icon ? P.icon(icon, { size: 16, sw: 2 }) : ''}${esc(link)}</a>` : ''}
    </div>
    ${subtitle ? `<p class="ps-sechead__sub">${esc(subtitle)}</p>` : ''}`;

  /* Tag de embalagem: "CAIXA 20un", "1L", "Aprox. 1.3kg" */
  ui.tag = (text) => `<span class="ps-tag">${esc(text)}</span>`;
  /* Badge de desconto: "6% OFF" */
  ui.offBadge = (off) => `<span class="ps-off">${off}% OFF</span>`;

  /* Área de ação do card: botão "+" circular OU stepper azul */
  ui.cardAction = (p, { size = 'md' } = {}) => {
    const q = P.cart.qty(p.id);
    if (!q) return `<button class="ps-add ps-add--${size}" data-action="add" data-id="${p.id}" aria-label="Adicionar">${P.icon('plus', { size: size === 'lg' ? 26 : 22, sw: 1.8 })}</button>`;
    return ui.stepper(p, { variant: 'solid' });
  };

  /* Stepper: solid (azul, dentro do card) | outline (branco, no carrinho) */
  ui.stepper = (p, { variant = 'solid' } = {}) => {
    const q = P.cart.qty(p.id);
    const u = P.sellUnit(p);
    const label = variant === 'solid' ? `${q}${u}` : `${q} ${u}`;
    const left = q > 1 ? 'minus' : 'trash';
    return `<div class="ps-stepper ps-stepper--${variant}">
      <button data-action="dec" data-id="${p.id}" aria-label="Diminuir">${P.icon(left, { size: variant === 'solid' ? 22 : 16, sw: 1.7 })}</button>
      <span class="ps-stepper__qty">${label}</span>
      <button data-action="add" data-id="${p.id}" aria-label="Aumentar">${P.icon('plus', { size: variant === 'solid' ? 24 : 15, sw: variant === 'solid' ? 1.7 : 2 })}</button>
    </div>`;
  };

  /* Bloco de preço do card */
  ui.priceBlock = (p) => {
    const sub = p.box
      ? `<div class="ps-price__sub">${P.fmt.brl(p.box.price)}/cx · ${p.box.qty}un</div>`
      : p.unitPrice ? `<div class="ps-price__sub">${P.fmt.brl(p.unitPrice)}/un</div>` : '';
    return `<div class="ps-price">
      <div class="ps-price__main ${p.off ? 'is-off' : ''}">${P.fmt.brl(p.price)}/${p.per}</div>
      ${p.off ? `<div class="ps-price__offrow">${ui.offBadge(p.off)}${p.strike ? `<s>${P.fmt.brl(p.strike)}</s>` : ''}</div>` : ''}
      ${sub}
    </div>`;
  };

  /* Card de produto
     size: 'sm' (124px, dentro de card de seção) | 'md' (146px, rail na página) | 'grid' (coluna de 2) */
  ui.productCard = (p, { size = 'md' } = {}) => {
    if (typeof p === 'string') p = P.product(p);
    if (!p) return '';
    const fav = P.cart.favs.has(p.id);
    return `<article class="ps-card ps-card--${size}" data-pid="${p.id}">
      <div class="ps-card__media">
        <img src="${P.productImg(p)}" alt="" loading="lazy">
        ${p.flag ? `<span class="ps-card__flag">🇦🇺</span>` : ''}
        <button class="ps-card__fav ${fav ? 'is-on' : ''}" data-action="fav" data-id="${p.id}" aria-label="Favoritar">${P.icon(fav ? 'heart-fill' : 'heart', { size: 26, sw: 1.5 })}</button>
        <div class="ps-card__action" data-slot="action" data-size="${size === 'sm' ? 'md' : 'lg'}">${ui.cardAction(p, { size: size === 'sm' ? 'md' : 'lg' })}</div>
      </div>
      <div class="ps-card__body">
        ${ui.tag(p.tag)}
        ${ui.priceBlock(p)}
        <h3 class="ps-card__name">${esc(p.name)}</h3>
        ${p.expiry ? `<span class="ps-expiry">Val. ${p.expiry}</span>` : ''}
        ${p.sponsored ? `<span class="ps-card__sponsored">Patrocinado</span>` : ''}
      </div>
    </article>`;
  };

  /* Rail horizontal de produtos */
  ui.productRail = (ids, { size = 'md' } = {}) =>
    `<div class="ps-rail ps-rail--${size}">${P.products(ids).map((p) => ui.productCard(p, { size })).join('')}</div>`;

  /* Grid 2 colunas */
  ui.productGrid = (ids) => `<div class="ps-grid">${P.products(ids).map((p) => ui.productCard(p, { size: 'grid' })).join('')}</div>`;

  /* Seção padrão: título + rail (opcionalmente dentro de card com borda) */
  ui.productSection = ({ title, ids, link = 'Ver todos', boxed = false, layout = 'rail' }) => {
    const body = layout === 'grid' ? ui.productGrid(ids) : ui.productRail(ids, { size: boxed ? 'sm' : 'md' });
    if (boxed) return `<section class="ps-section ps-section--boxed"><div class="ps-boxcard">${ui.sectionHeader({ title, link })}${body}</div></section>`;
    return `<section class="ps-section">${ui.sectionHeader({ title, link })}${body}</section>`;
  };

  /* Prateleira de marca (banner + logo + rail) — ex.: Harald, Pernod Ricard */
  ui.brandShelf = ({ banner, logo, name, tagline, ids }) => `
    <section class="ps-section ps-section--boxed">
      <div class="ps-boxcard ps-boxcard--brand">
        <img class="ps-brand__banner" src="${P.asset('banners/' + banner)}" alt="">
        <div class="ps-brand__head">
          ${logo ? `<img class="ps-brand__logo" src="${P.asset('brand/' + logo)}" alt="">` : ''}
          <div class="ps-brand__txt"><strong>${esc(name)}</strong><span>${esc(tagline)}</span></div>
          <a class="ps-sechead__link" href="#">Ver todos</a>
        </div>
        ${ui.productRail(ids, { size: 'sm' })}
      </div>
    </section>`;

  /* Departamentos (círculos) */
  ui.departments = (list = P.departments) => `
    <section class="ps-section">
      ${ui.sectionHeader({ title: 'Compre por departamento', link: '' })}
      <div class="ps-depts">${list.map((d) => `
        <a class="ps-dept" href="#">
          <span class="ps-dept__img"><img src="${P.asset('departments/' + d.img)}" alt=""></span>
          <span class="ps-dept__name">${esc(d.name)}</span>
        </a>`).join('')}</div>
    </section>`;

  /* Combo promocional */
  ui.comboCard = (c) => `
    <div class="ps-combo">
      <div class="ps-combo__head"><strong>${esc(c.name)}</strong><span class="ps-combo__disc">${P.fmt.brl(c.discount)} de desconto</span></div>
      <div class="ps-combo__items">
        ${c.items.map((it, i) => `${i ? '<span class="ps-combo__plus">+</span>' : ''}
          <div class="ps-combo__item">
            <div class="ps-combo__img"><img src="${P.asset('products/' + it.img)}" alt=""><span class="ps-combo__qty">${esc(it.qty)}</span></div>
            <div class="ps-combo__price"><b>${P.fmt.brl(it.price)}/un</b> <s>${P.fmt.brl(it.strike)}</s></div>
            <div class="ps-combo__name">${esc(it.name)}</div>
          </div>`).join('')}
      </div>
      <button class="ps-btn ps-btn--primary ps-btn--block">Adicionar ao carrinho <span class="ps-btn__meta">${P.fmt.brl(c.items.reduce((s, i) => s + i.price, 0))} (${c.items.length} produtos)</span></button>
    </div>`;

  ui.comboSection = (combos = P.combos) => `
    <section class="ps-section">
      ${ui.sectionHeader({ title: 'Combos promocionais', subtitle: 'Adicione combos ao carrinho e aproveite descontos especiais!' })}
      <div class="ps-combo-wrap">${combos.map(ui.comboCard).join('')}</div>
      <div class="ps-pager">${combos.map((_, i) => `<span class="${i ? '' : 'is-active'}"></span>`).join('')}</div>
    </section>`;

  /* Card "Tem uma lista de compras?" (Explorar) */
  ui.shoppingListCard = () => `
    <div class="ps-listcard">
      <div class="ps-listcard__txt"><strong>Tem uma lista de compras?</strong><span>Busque todos os seus produtos de uma vez!</span></div>
      <button class="ps-listcard__btn">${P.icon('list-search', { size: 22, sw: 1.6 })}<span>Buscar por lista</span></button>
    </div>`;

  /* Card de categoria (Explorar) */
  ui.categoryCard = ({ name, img, badge = '' }) => `
    <a class="ps-catcard" href="#">
      <span class="ps-catcard__name">${esc(name)}</span>
      <span class="ps-catcard__chev">${P.icon('chevron-right', { size: 14, sw: 2.2 })}</span>
      <img src="${P.asset('departments/' + img)}" alt="">
      ${badge ? `<span class="ps-catcard__badge">${P.icon('star', { size: 13 })}${esc(badge)}</span>` : ''}
    </a>`;

  /* Item de lista com ícone + chevron (Conta) */
  ui.menuItem = ({ icon, label, href = '#' }) => `
    <a class="ps-menuitem" href="${href}">${P.icon(icon, { size: 26, sw: 1.6 })}<span>${esc(label)}</span>${P.icon('chevron-right', { size: 20, sw: 1.8, cls: 'ps-menuitem__chev' })}</a>`;

  /* Linha de item do carrinho */
  ui.cartLine = ({ p, q, total, strike }) => `
    <div class="ps-cartline" data-pid="${p.id}">
      <img class="ps-cartline__img" src="${P.productImg(p)}" alt="">
      <div class="ps-cartline__info">
        <div class="ps-cartline__name">${esc(p.name)}</div>
        <div class="ps-cartline__unit">${P.fmt.brl(P.lineUnitPrice(p))}/${P.sellUnit(p)}</div>
      </div>
      <div class="ps-cartline__prices">
        <b class="${strike ? 'is-off' : ''}">${P.fmt.brl(total)}</b>
        ${strike ? `<s>${P.fmt.brl(strike)}</s>` : ''}
      </div>
      <div class="ps-cartline__stepper">${ui.stepper(p, { variant: 'outline' })}</div>
    </div>`;

  /* Rodapé fixo do carrinho */
  ui.checkoutBar = ({ total, count, label = 'Continuar para pagamento' }) => `
    <div class="ps-checkout">
      <div class="ps-checkout__label">Total</div>
      <div class="ps-checkout__total"><b>${P.fmt.brl(total)}</b> <span>/ ${count} ${count === 1 ? 'item' : 'itens'}</span></div>
      <button class="ps-btn ps-btn--primary ps-btn--block ps-btn--lg">${esc(label)}</button>
    </div>`;

  /* Skeleton de rail (estado de carregamento) */
  ui.skeletonRail = (n = 3) => `<div class="ps-rail ps-rail--sm">${Array.from({ length: n }, () => `
    <div class="ps-skel-card"><div class="ps-skel ps-skel--img"></div><div class="ps-skel ps-skel--line"></div><div class="ps-skel ps-skel--line ps-skel--short"></div></div>`).join('')}</div>`;

  /* Botões */
  ui.button = ({ label, variant = 'primary', block = false, size = '' }) =>
    `<button class="ps-btn ps-btn--${variant} ${block ? 'ps-btn--block' : ''} ${size ? 'ps-btn--' + size : ''}">${esc(label)}</button>`;

  /* Tab bar */
  P.tabs = [
    { id: 'inicio', label: 'Início', icon: 'home', iconOn: 'home-fill' },
    { id: 'explorar', label: 'Explorar', icon: 'search', iconOn: 'search-bold' },
    { id: 'notificacoes', label: 'Notificações', icon: 'bell', iconOn: 'bell-fill' },
    { id: 'conta', label: 'Conta', icon: 'user', iconOn: 'user-fill' },
    { id: 'carrinho', label: 'Carrinho', icon: 'cart', iconOn: 'cart-fill' },
  ];
  ui.tabBar = (active) => `
    <nav class="ps-tabbar">${P.tabs.map((t) => {
      const on = t.id === active;
      const badge = t.id === 'carrinho' && P.cart.count() ? `<span class="ps-tabbar__badge">${P.cart.count()}</span>` : '';
      return `<a class="ps-tabbar__item ${on ? 'is-active' : ''}" href="#/${t.id}">
        <span class="ps-tabbar__icon">${P.icon(on ? t.iconOn : t.icon, { size: 26, sw: 1.6 })}${badge}</span>
        <span class="ps-tabbar__label">${t.label}</span></a>`;
    }).join('')}</nav>`;

  /* ================================================================ APP SHELL
     Praso.app({
       screens: { nome: (ctx) => ({ header, body, footer, tab, tabbar }) },
       initial: 'inicio',
       statusBar: { time: '09:17' },
       cart: { id: qty }            // carrinho inicial
     })
  ================================================================ */
  P.app = function (cfg) {
    const screens = { ...(P.screens || {}), ...(cfg.screens || {}) };
    if (cfg.cart !== undefined) P.cart.items = { ...cfg.cart };
    else if (P.initialCart) P.cart.items = { ...P.initialCart };

    const inFrame = window.self !== window.top;
    const isTouch = matchMedia('(pointer: coarse)').matches && !inFrame;
    document.documentElement.classList.toggle('ps-is-device', isTouch);
    document.documentElement.classList.toggle('ps-in-frame', inFrame);

    const root = document.getElementById('app') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'app' }));
    root.className = 'ps-app';
    root.innerHTML = `${ui.statusBar(cfg.statusBar)}<div class="ps-viewport"><div class="ps-header" data-r="header"></div><main class="ps-scroll" data-r="scroll"></main><div class="ps-footer" data-r="footer"></div></div><div data-r="tabbar"></div><div class="ps-home-indicator"></div>`;
    const $ = (r) => root.querySelector(`[data-r="${r}"]`);
    let current = null;

    function render() {
      const name = (location.hash.replace(/^#\/?/, '').split('?')[0]) || cfg.initial || 'inicio';
      const fn = screens[name] || screens[cfg.initial || 'inicio'];
      const s = fn({ P, name }) || {};
      const keepScroll = current === name;
      const y = $('scroll').scrollTop;
      current = name;
      root.dataset.screen = name;
      root.classList.toggle('ps-app--splash', !!s.fullscreen);
      $('header').innerHTML = s.header || '';
      $('scroll').innerHTML = s.body || '';
      $('footer').innerHTML = s.footer || '';
      $('tabbar').innerHTML = s.tabbar === false || s.fullscreen ? '' : ui.tabBar(s.tab || name);
      $('scroll').scrollTop = keepScroll ? y : 0;
      root.querySelector('.ps-statusbar').classList.toggle('is-light', !!s.lightStatus);
      if (s.onMount) s.onMount(root);
    }

    /* atualizações cirúrgicas quando o carrinho muda (preserva scroll dos rails) */
    P.cart.on((id) => {
      if (current === 'carrinho' || id === null) return render();
      root.querySelectorAll(`[data-pid="${id}"]`).forEach((card) => {
        const slot = card.querySelector('[data-slot="action"]');
        if (slot) slot.innerHTML = ui.cardAction(P.product(id), { size: slot.dataset.size });
        const fav = card.querySelector('.ps-card__fav');
        if (fav) { const on = P.cart.favs.has(id); fav.classList.toggle('is-on', on); fav.innerHTML = P.icon(on ? 'heart-fill' : 'heart', { size: 26, sw: 1.5 }); }
      });
      $('tabbar').innerHTML = $('tabbar').innerHTML ? ui.tabBar(current) : '';
    });

    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-action]');
      if (!b) return;
      e.preventDefault();
      const { action, id } = b.dataset;
      if (action === 'add') P.cart.add(id);
      else if (action === 'dec') P.cart.dec(id);
      else if (action === 'fav') P.cart.toggleFav(id);
      else if (action === 'clear-cart') P.cart.clear();
      else if (action === 'back') history.back();
      else if (cfg.actions && cfg.actions[action]) cfg.actions[action](b, e);
    });

    /* paginação dos combos acompanha o scroll */
    root.addEventListener('scroll', (e) => {
      const w = e.target; if (!w.classList || !w.classList.contains('ps-combo-wrap')) return;
      const i = Math.round(w.scrollLeft / (w.firstElementChild.offsetWidth + 9));
      w.parentElement.querySelectorAll('.ps-pager span').forEach((d, j) => d.classList.toggle('is-active', i === j));
    }, true);

    window.addEventListener('hashchange', render);
    render();
    return { render };
  };
})();

  <script>
/* ==========================================================================
   Telas padrão do app Praso (estado atual em produção, out/2026).
   Cada tela é uma função (ctx) => { header, body, footer, tab, tabbar, fullscreen }.
   Protótipos podem reutilizar (Praso.screens.inicio) ou sobrescrever
   passando screens: { inicio: () => ({...}) } para Praso.app().
   ========================================================================== */
(function () {
  const P = window.Praso;
  const ui = P.ui;
  const S = (P.screens = P.screens || {});

  /* ---------------------------------------------------------- Splash */
  S.splash = () => ({
    fullscreen: true,
    lightStatus: true,
    body: `<div class="ps-splash"><img src="${P.asset('brand/praso-logo-white.png')}" alt="praso"></div>`,
    onMount: () => { setTimeout(() => { if (location.hash.includes('splash')) location.hash = '#/inicio'; }, 1400); },
  });

  /* ---------------------------------------------------------- Início */
  S.inicio = () => ({
    tab: 'inicio',
    header: `<div class="ps-header__search">${ui.search()}</div>`,
    body: `
      <div class="ps-page-pad">${ui.heroCarousel()}</div>
      ${ui.productSection({ title: 'Ofertas da semana', link: 'Ver todas', boxed: true, ids: ['cafe-uniao', 'leite-natville', 'kitkat', 'farinha-finna'] })}
      ${ui.productSection({ title: 'Seus produtos', link: 'Ver todos', layout: 'grid', ids: ['redbull-summer', 'qualimax-uva', 'salsicha-seara', 'linguica-defumada-seara', 'picanha-teys'] })}
      ${ui.departments()}
      ${ui.brandShelf({ banner: 'pernod.png', logo: 'pernod-logo.png', name: 'Pernod Ricard', tagline: 'Bons Momentos a partir de um Bom Lugar', ids: ['gin-beefeater', 'whisky-chivas', 'gin-orloff'] })}
      ${ui.productSection({ title: 'Embutidos', ids: ['linguica-calabresa-seara', 'salsicha-seara', 'linguica-defumada-seara'] })}
      <section class="ps-section"><div class="ps-tiles">
        ${['tile-queijos.png', 'tile-carnes.png', 'tile-queijos.png'].map((t) => `<a class="ps-tile" href="#"><img src="${P.asset('banners/' + t)}" alt=""><span class="ps-tile__cta">Ver ofertas ${P.icon('arrow-right', { size: 12, sw: 2.4 })}</span></a>`).join('')}
      </div></section>
      ${ui.comboSection()}
      ${ui.brandShelf({ ...P.banners.harald, banner: P.banners.harald.img, ids: ['cobertura-harald', 'recheio-harald', 'melken-granule'] })}
      ${ui.productSection({ title: 'Azeites e Óleo Composto', ids: ['azeite-dende-cepera', 'oleo-st-isabel', 'oleo-soya'] })}
      ${ui.productSection({ title: 'Confeitaria', ids: ['chanty-amelia', 'nutella', 'margarina-medalha'] })}
      ${ui.productSection({ title: 'Orientais', ids: ['shoyu-cepera', 'farinha-panko', 'mostarda-cepera'] })}
      <div class="ps-bottom-space"></div>`,
  });

  /* ---------------------------------------------------------- Explorar */
  S.explorar = () => ({
    tab: 'explorar',
    header: `<div class="ps-header__search">${ui.search()}</div>`,
    body: `
      <div class="ps-page-pad ps-explorar-list">${ui.shoppingListCard()}</div>
      <section class="ps-section">
        ${ui.sectionHeader({ title: 'Combinam com seu negócio', link: '' })}
        ${ui.productRail(['papel-bigroll', 'cafe-pilao', 'leite-natville', 'mostarda-cepera'])}
      </section>
      <section class="ps-section">
        ${ui.sectionHeader({ title: 'Categorias para você', link: 'Ver todas as categorias', icon: 'grid' })}
        <div class="ps-catgrid ps-page-pad">
          ${ui.categoryCard({ name: 'Bebidas Não-Alcoólicas', img: 'bebidas-cat.png', badge: 'Você compra muito' })}
          ${ui.categoryCard({ name: 'Mercearia', img: 'mercearia-cat.png' })}
          ${ui.categoryCard({ name: 'Confeitaria', img: 'confeitaria.png' })}
          ${ui.categoryCard({ name: 'Açougue', img: 'acougue.png' })}
        </div>
      </section>
      <div class="ps-bottom-space"></div>`,
  });

  /* ---------------------------------------------------------- Notificações */
  S.notificacoes = () => ({
    tab: 'notificacoes',
    header: ui.navHeader({ title: 'Notificações' }),
    body: `
      <div class="ps-notifs">${P.notifications.map((n) => `
        <div class="ps-notif">
          <div class="ps-notif__top"><strong>${P.esc(n.title)}</strong><span>${P.esc(n.when)}</span></div>
          <p>${P.esc(n.body)}</p>
        </div>`).join('')}</div>
      <div class="ps-notifs__spacer"></div>
      <div class="ps-divider-thick"></div>
      <div class="ps-empty-note"><strong>Você visualizou todas as notificações!</strong><span>Confira abaixo algumas ofertas 👇</span></div>
      <div class="ps-page-pad">${ui.productGrid(['cafe-uniao', 'leite-natville', 'kitkat', 'nutella'])}</div>
      <div class="ps-bottom-space"></div>`,
  });

  /* ---------------------------------------------------------- Conta */
  S.conta = () => ({
    tab: 'conta',
    body: `
      <div class="ps-profile">
        <span class="ps-profile__avatar">${P.icon('store', { size: 22, sw: 1.8 })}</span>
        <strong>${P.esc(P.user.name)}</strong>
        <span>${P.esc(P.user.doc)}</span>
      </div>
      <div class="ps-page-pad">
        <a class="ps-help" href="#">${P.icon('chat', { size: 26, sw: 1.6 })}<span><strong>Precisa de ajuda?</strong>Converse com nosso suporte!</span></a>
        <div class="ps-menu">
          ${ui.menuItem({ icon: 'truck', label: 'Pedidos' })}
          ${ui.menuItem({ icon: 'money', label: 'Pagamentos' })}
          ${ui.menuItem({ icon: 'bank', label: 'Crédito' })}
          ${ui.menuItem({ icon: 'wallet', label: 'Carteira Praso' })}
          ${ui.menuItem({ icon: 'doc', label: 'Notas Fiscais' })}
          ${ui.menuItem({ icon: 'camera', label: 'Foto do estoque' })}
        </div>
        <div class="ps-overline">Benefícios</div>
        ${ui.banner({ img: 'indica-praso.png', alt: 'Indica Praso — ganhe até R$150' })}
        <div class="ps-overline">Configurações</div>
        <div class="ps-menu">
          ${ui.menuItem({ icon: 'pin', label: 'Endereços' })}
          ${ui.menuItem({ icon: 'id-card', label: 'Informações de Cadastro' })}
        </div>
      </div>
      <div class="ps-bottom-space"></div>`,
  });

  /* ---------------------------------------------------------- Carrinho */
  S.carrinho = () => {
    const lines = P.cart.lines();
    const trash = `<button class="ps-iconbtn ps-iconbtn--soft" data-action="clear-cart" aria-label="Esvaziar carrinho">${P.icon('trash', { size: 22, sw: 1.6 })}</button>`;
    if (!lines.length) {
      return {
        tab: 'carrinho',
        header: ui.navHeader({ title: 'Carrinho' }),
        body: `<div class="ps-empty"><span class="ps-empty__ico">${P.icon('cart', { size: 40, sw: 1.4 })}</span><strong>Seu carrinho está vazio</strong><span>Adicione produtos para continuar</span><a class="ps-btn ps-btn--primary" href="#/inicio">Ver ofertas</a></div>`,
      };
    }
    return {
      tab: 'carrinho',
      header: ui.navHeader({ title: 'Carrinho', action: trash }),
      body: `
        <div class="ps-cartlist">${lines.map(ui.cartLine).join('')}</div>
        <section class="ps-section ps-section--boxed">
          <div class="ps-boxcard">
            <h2 class="ps-boxcard__title-blue">Quem comprou os seus produtos também levou</h2>
            ${ui.productRail(['mostarda-cepera', 'agua-sanitaria-olimpo', 'oleo-soya', 'margarina-medalha', 'farinha-finna', 'linguica-defumada-seara'], { size: 'sm' })}
          </div>
        </section>
        <div class="ps-bottom-space--sm"></div>`,
      footer: ui.checkoutBar({ total: P.cart.total(), count: lines.length }),
    };
  };

  /* ---------------------------------------------------------- Busca (placeholder simples) */
  S.busca = () => ({
    tab: 'explorar',
    header: `<div class="ps-header__search ps-header__search--back"><a class="ps-iconbtn" href="#/inicio">${P.icon('chevron-left', { size: 24 })}</a>${ui.search({ value: 'café' })}</div>`,
    body: `<div class="ps-page-pad ps-mt-2">${ui.productGrid(P.catalog.filter((p) => /caf/i.test(p.name)).map((p) => p.id).concat(['leite-natville', 'nutella']))}</div><div class="ps-bottom-space"></div>`,
  });
})();

</script>
  <script>
    const { ui, icon } = Praso;
    const brl = Praso.fmt.brl;
    const qs = new URLSearchParams(location.search);
    const ARMS = ['controle', 'k', 'm', 'n'];
    const braco = 'n';
    const delay = Number(qs.get('delay') ?? 2) * 1000;
    const FOCO = 'cobertura-harald';
    const check = (size, sw) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`;

    /* ---------- peças comuns ---------- */
    const prodInfo = (p, { badge = false, why = '' } = {}) => `
      <div class="x-prod">
        <img src="${Praso.productImg(p)}" alt="">
        <div class="x-prod__info">
          ${badge ? '<span class="x-badge-new">Novo para você</span>' : ''}
          <div class="x-prod__name">${Praso.esc(p.name)}</div>
          ${ui.tag(p.tag)}
          ${ui.priceBlock(p)}
          ${why}
        </div>
      </div>`;

    const rail = () => `
      <section class="ps-section ps-section--boxed"><div class="ps-boxcard">
        <h2 class="ps-boxcard__title-blue">Quem comprou os seus produtos também levou</h2>
        ${ui.productRail(['mostarda-cepera', 'agua-sanitaria-olimpo', 'oleo-soya', 'margarina-medalha', 'farinha-finna', 'linguica-defumada-seara'], { size: 'sm' })}
      </div></section>`;

    /* ---------- K · cartões um a um ---------- */
    const K_ITEMS = [
      { id: 'cobertura-harald', badge: true, why: 'Mais vendido em Chocolates e Coberturas nos últimos 30 dias' },
      { id: 'recheio-harald', badge: true, why: 'Mais vendido em Confeitaria nos últimos 30 dias' },
      { id: 'melken-granule', badge: false, why: 'Clientes parecidos com você compram' },
    ];
    let kIdx = 0;
    let kAdded = 0;
    const blockK = () => {
      if (kIdx >= K_ITEMS.length) {
        const msg = kAdded === 0 ? 'Nenhuma foi adicionada' : kAdded === 1 ? '1 adicionada ao pedido' : `${kAdded} adicionadas ao pedido`;
        return `<section class="x-sec"><h2 class="x-title">Descubra novidades para seu pedido</h2>
          <div class="x-done"><div><strong>Você viu as 3 sugestões</strong><span>${msg}</span></div>
          <button class="x-btn-outline" data-action="x-k-restart">Ver de novo</button></div></section>`;
      }
      const it = K_ITEMS[kIdx];
      const p = Praso.product(it.id);
      const left = K_ITEMS.length - kIdx;
      return `<section class="x-sec"><h2 class="x-title">Descubra novidades para seu pedido</h2>
        <div class="x-muted" style="margin-top:3px">${kIdx + 1} de ${K_ITEMS.length} sugestões</div>
        <div class="x-k-stack">
          ${left >= 3 ? '<div class="x-k-back x-k-back--2"></div>' : ''}
          ${left >= 2 ? '<div class="x-k-back x-k-back--1"></div>' : ''}
          <article class="x-k-card" data-k="${kIdx}">
            ${it.badge ? '<span class="x-badge-new">Novo para você</span>' : ''}
            ${prodInfo(p).replace('<span class="x-badge-new">Novo para você</span>', '')}
            <div class="x-reason">${it.why}</div>
            <div class="x-k-actions">
              <button class="x-btn-ghost" data-action="x-k-skip">Pular</button>
              <button class="x-btn-blue" data-action="x-k-add">${check(18, 2.4)}Adicionar</button>
            </div>
          </article>
        </div></section>`;
    };

    /* ---------- M · progresso de categorias ---------- */
    const M_BASE = 4, M_TOTAL = 6;
    const M_SUGG = [
      { id: 'cobertura-harald', cat: 'Chocolates e Coberturas' },
      { id: 'shoyu-cepera', cat: 'Molhos e Orientais' },
    ];
    const blockM = () => {
      const got = M_SUGG.filter((s) => Praso.cart.qty(s.id) > 0).length;
      const cats = M_BASE + got;
      const falta = M_TOTAL - cats;
      const next = M_SUGG.find((s) => !Praso.cart.qty(s.id));
      const title = got ? `Com este pedido: ${cats} de ${M_TOTAL} categorias` : `Você já comprou ${cats} de ${M_TOTAL} categorias`;
      const sub = falta === 0 ? 'Você completou todas as categorias' : falta === 1 ? 'Falta só 1 categoria para uma cesta completa' : `Faltam ${falta} categorias para uma cesta mais variada`;
      let card;
      if (next) {
        const p = Praso.product(next.id);
        card = `<article class="x-m__card" data-pid="${p.id}"><div class="x-prod">
            <img src="${Praso.productImg(p)}" alt="">
            <div class="x-prod__info">
              <div class="x-m__cat">${next.cat}</div>
              <div class="x-prod__name">${Praso.esc(p.name)}</div>
              ${ui.priceBlock(p)}
              <button class="ps-add ps-add--md x-m__add" data-action="x-m-add" data-id="${p.id}" aria-label="Adicionar">${icon('plus', { size: 22, sw: 1.8 })}</button>
            </div></div></article>`;
      } else {
        card = `<div class="x-m__ok"><i>${check(18, 2.6)}</i><div><strong style="font-size:13px;font-weight:600">Cesta completa!</strong><div class="x-muted" style="font-size:12px">Seu pedido tem as ${M_TOTAL} categorias.</div></div></div>`;
      }
      return `<section class="x-sec"><div class="x-m">
        <h2 class="x-title">Amplie seu sortimento</h2>
        <div class="x-m__count">${title}</div>
        <div class="x-m__bar"><i style="width:${(cats / M_TOTAL * 100).toFixed(1)}%"></i></div>
        <div class="x-muted" style="margin-top:8px">${sub}</div>
        ${card}
      </div></section>`;
    };

    /* ---------- N · notificação expansível a partir do sino ---------- */
    const nState = { open: false, seen: false, timerDone: false };
    const nPopup = () => {
      const p = Praso.product(FOCO);
      const added = Praso.cart.qty(FOCO) > 0;
      return `<button class="x-n-overlay" data-action="x-n-close" aria-label="Fechar sugestão"></button>
        <div class="x-n-pop" role="dialog" aria-label="Sugestão para você">
          <div class="x-n-head"><strong>Para você</strong><span>agora</span>
            <button class="x-n-close" data-action="x-n-close" aria-label="Fechar">${icon('close', { size: 14, sw: 2.4 })}</button></div>
          ${prodInfo(p, { badge: true, why: '<div class="x-n-why">Mais vendido em Chocolates e Coberturas</div>' })}
          ${added
            ? `<a class="x-n-added" href="#/carrinho" data-action="x-n-close-go">${check(18, 2.4)}Adicionado · ver carrinho</a>`
            : `<button class="x-btn-blue" data-action="add" data-id="${FOCO}">Adicionar ao carrinho</button>`}
        </div>`;
    };
    function nPaint(root) {
      root.querySelectorAll('.x-n-layer').forEach((n) => n.remove());
      const onHome = root.dataset.screen === 'inicio';
      const bell = root.querySelector('.ps-tabbar__item[href="#/notificacoes"] .ps-tabbar__icon');
      if (bell && !nState.seen && Praso.cart.qty(FOCO) === 0 && !bell.querySelector('.x-bell-badge')) {
        bell.insertAdjacentHTML('beforeend', '<span class="ps-tabbar__badge x-bell-badge">1</span>');
        if (nState.timerDone && !nState.open) bell.classList.add('x-ring');
      }
      if (onHome && nState.open) {
        const layer = document.createElement('div');
        layer.className = 'x-n-layer';
        layer.innerHTML = nPopup();
        root.appendChild(layer);
      }
    }

    /* ---------- seletor de braço ---------- */
    const armsBar = () => `<nav class="x-arms" aria-label="Braço do teste">${ARMS.map((a) =>
      `<a class="${a === braco ? 'is-on' : ''}" href="?braco=${a}${a === 'n' ? '#/inicio' : '#/carrinho'}">${a === 'controle' ? 'Controle' : a.toUpperCase()}</a>`).join('')}</nav>`;

    /* ---------- mantém o bloco de cross-sell parado na tela ----------
       Ao adicionar/pular, o carrinho cresce para cima (rolagem compensada)
       em vez de empurrar o bloco para baixo. */
    let spacerH = 0;
    function keepPos(fn) {
      const sc = document.querySelector('#app .ps-scroll');
      const blk = sc && sc.querySelector('[data-xs-block]');
      const before = blk ? blk.getBoundingClientRect().top : null;
      fn();
      const b2 = sc && sc.querySelector('[data-xs-block]');
      if (before === null || !b2) return;
      const d = b2.getBoundingClientRect().top - before;
      if (Math.abs(d) < 1) return;
      const want = Math.max(0, sc.scrollTop + d);
      const max = sc.scrollHeight - sc.clientHeight;
      if (want > max) { spacerH += want - max; sc.querySelector('.x-spacer').style.height = spacerH + 'px'; }
      sc.scrollTop = want;
    }

    /* ---------- telas ---------- */
    const carrinho = () => {
      const lines = Praso.cart.lines();
      if (!lines.length) return Praso.screens.carrinho();
      const trash = `<button class="ps-iconbtn ps-iconbtn--soft" data-action="clear-cart" aria-label="Esvaziar carrinho">${icon('trash', { size: 22, sw: 1.6 })}</button>`;
      const block = braco === 'k' ? blockK() : braco === 'm' ? blockM() : rail();
      return {
        tab: 'carrinho',
        header: ui.navHeader({ title: 'Carrinho', action: trash }),
        body: `<div class="ps-cartlist">${lines.map(ui.cartLine).join('')}</div><div data-xs-block>${block}</div><div class="x-spacer" style="height:${spacerH}px"></div><div class="ps-bottom-space--sm"></div>`,
        footer: ui.checkoutBar({ total: Praso.cart.total(), count: lines.length }),
      };
    };

    const screens = { carrinho };
    if (braco === 'n') {
      screens.inicio = () => ({ ...Praso.screens.inicio(), onMount: nPaint });
      screens.notificacoes = () => {
        const base = Praso.screens.notificacoes();
        const p = Praso.product(FOCO);
        const added = Praso.cart.qty(FOCO) > 0;
        const card = `<div class="ps-mt-2 x-notif-foco">
            <div class="x-n-head"><strong>Para você</strong><span>agora</span></div>
            ${prodInfo(p, { badge: true, why: '<div class="x-n-why">Mais vendido em Chocolates e Coberturas</div>' })}
            ${added ? `<a class="x-n-added" href="#/carrinho">${check(18, 2.4)}Adicionado · ver carrinho</a>`
                    : `<button class="x-btn-blue" data-action="add" data-id="${FOCO}">Adicionar ao carrinho</button>`}
          </div>`;
        return { ...base, body: card + base.body, onMount: () => { nState.seen = true; } };
      };
    }

    const app = Praso.app({
      initial: braco === 'n' ? 'inicio' : 'carrinho',
      cart: { 'leite-natville': 3, 'redbull-summer': 1 },
      screens,
      actions: {
        'x-k-skip': () => keepPos(() => { kIdx++; app.render(); }),
        'x-k-add': () => keepPos(() => { const id = K_ITEMS[kIdx].id; kIdx++; kAdded++; Praso.cart.add(id); }),
        'x-m-add': (b) => keepPos(() => Praso.cart.add(b.dataset.id)),
        'x-k-restart': () => { kIdx = 0; kAdded = 0; app.render(); },
        'x-n-close': () => { nState.open = false; nState.seen = true; app.render(); },
        'x-n-close-go': () => { nState.open = false; nState.seen = true; location.hash = '#/carrinho'; },
      },
    });

    const root = document.getElementById('app');
    /* seletor de braço desligado na versão do Notion */

    if (braco === 'n') {
      /* re-render da tela atual quando o carrinho muda (atualiza o popup e o card da notificação) */
      Praso.cart.on(() => { if (root.dataset.screen !== 'carrinho') app.render(); });
      setTimeout(() => {
        nState.timerDone = true;
        if (nState.seen) return;
        if (root.dataset.screen === 'inicio') nPaint(root);
        setTimeout(() => { if (!nState.seen) { nState.open = true; app.render(); } }, 700);
      }, delay);
    }
  </script>
<script>
(function () {
  function fit() { var a = document.querySelector('.ps-app'); if (!a) return; var s = Math.min(1, (window.innerHeight - 40) / 852, (window.innerWidth - 40) / 393); a.style.zoom = s > 0.3 ? s : 0.3; }
  window.addEventListener('resize', fit); setTimeout(fit, 0); fit();
})();
</script>
</body>
</html>
