<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praso Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #0b1020; --muted: #6b7280; --line: #e5e7eb;
    --hover: #f3f4f6; --accent: #2053ce; --accent-soft: #eef3fe; --stage: #eceef2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0d0f14; --panel: #151821; --text: #eef0f5; --muted: #9aa1ae; --line: #262a35; --hover: #1d212c; --accent: #6b93ff; --accent-soft: #1b2440; --stage: #10131a; }
  }
  :root[data-theme="dark"] { --bg: #0d0f14; --panel: #151821; --text: #eef0f5; --muted: #9aa1ae; --line: #262a35; --hover: #1d212c; --accent: #6b93ff; --accent-soft: #1b2440; --stage: #10131a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .layout { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
  .brand__mark { width: 30px; height: 30px; border-radius: 8px; background: #2053ce; display: grid; place-items: center; }
  .brand__mark img { width: 22px; height: auto; }
  .brand b { font-size: 15px; letter-spacing: -.2px; }
  .brand span { display: block; font-size: 12px; color: var(--muted); }
  .filter { margin: 0 14px 10px; }
  .filter input { width: 100%; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 13px; outline: none; }
  .filter input:focus { border-color: var(--accent); }
  .group { padding: 10px 18px 6px; font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
  nav.list { flex: 1; overflow: auto; padding: 0 8px 12px; }
  .item { display: block; padding: 10px 10px; border-radius: 8px; margin-bottom: 2px; }
  .item:hover { background: var(--hover); }
  .item.is-active { background: var(--accent-soft); }
  .item__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .item__title { font-size: 13.5px; font-weight: 600; }
  .item.is-active .item__title { color: var(--accent); }
  .item__desc { margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item__meta { margin-top: 5px; font-size: 11px; color: var(--muted); }
  .pill { flex: none; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--hover); color: var(--muted); text-transform: lowercase; }
  .pill--baseline { background: #e0e9ff; color: #2053ce; }
  .pill--aprovado { background: #dcfce7; color: #166534; }
  .pill--em-teste { background: #fef3c7; color: #92400e; }
  .aside__foot { border-top: 1px solid var(--line); padding: 12px 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .aside__foot code { font-size: 11px; background: var(--hover); padding: 1px 5px; border-radius: 4px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .topbar__info { flex: 1; min-width: 0; }
  .topbar h1 { margin: 0; font-size: 16px; letter-spacing: -.2px; }
  .topbar p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--hover); }
  .screens { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 22px 0; }
  .chip { height: 28px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); }
  .chip.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stage { flex: 1; min-height: 0; display: grid; place-items: center; background: var(--stage); overflow: hidden; position: relative; }
  .phone { position: absolute; left: 50%; top: 50%; width: 393px; height: 852px; border-radius: 55px; background: #000; box-shadow: 0 0 0 11px #111, 0 0 0 13px #3b3b3e, 0 40px 90px rgba(0,0,0,.28); overflow: hidden; transform-origin: center center; }
  .phone iframe { width: 393px; height: 852px; border: 0; display: block; background: #fff; }
  .wide iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .wide { position: absolute; inset: 0; }
  .scale-note { position: absolute; right: 14px; bottom: 10px; font-size: 11px; color: var(--muted); }

  /* Mobile: só a lista; tocar abre o protótipo em tela cheia */
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    main { display: none; }
    aside { border-right: 0; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">
      <span class="brand__mark"><img src="ds/assets/brand/praso-mark-white.png" alt="" style="width:16px"></span>
      <div><b>Praso Playground</b><span>Protótipos do app em HTML</span></div>
    </div>
    <div class="filter"><input id="q" type="search" placeholder="Filtrar protótipos…"></div>
    <nav class="list" id="list"></nav>
    <div class="aside__foot">Novo protótipo: copie <code>prototypes/_template</code> e registre em <code>prototypes/registry.js</code>.</div>
  </aside>
  <main>
    <div class="topbar">
      <div class="topbar__info"><h1 id="t">—</h1><p id="d"></p></div>
      <div class="actions">
        <button class="btn" id="reload" title="Recarregar">↻ Recarregar</button>
        <a class="btn" id="open" target="_blank" rel="noopener">Abrir em nova aba ↗</a>
      </div>
    </div>
    <div class="screens" id="screens"></div>
    <div class="stage" id="stage"></div>
  </main>
</div>

<script src="prototypes/registry.js"></script>
<script>
  const DS = { slug: '__ds', title: 'Design System', description: 'Tokens, componentes e catálogo de produtos usados em todos os protótipos.', status: 'referência', wide: true, url: 'ds/index.html' };
  const all = [DS, ...(window.PRASO_PROTOTYPES || [])];
  const $ = (id) => document.getElementById(id);
  const urlOf = (p, s) => p.url || `prototypes/${p.slug}/index.html${s ? '#/' + s : ''}`;
  const params = new URLSearchParams(location.search);
  let state = { slug: params.get('p') || (window.PRASO_PROTOTYPES?.[0]?.slug ?? '__ds'), screen: params.get('s') || '' };

  function renderList() {
    const q = $('q').value.toLowerCase();
    const items = all.filter((p) => !q || (p.title + p.description + (p.author || '')).toLowerCase().includes(q));
    const row = (p) => `
      <a class="item ${p.slug === state.slug ? 'is-active' : ''}" href="?p=${p.slug}" data-slug="${p.slug}">
        <div class="item__top"><span class="item__title">${p.title}</span><span class="pill pill--${(p.status || '').replace(/\s+/g, '-')}">${p.status || ''}</span></div>
        <div class="item__desc">${p.description || ''}</div>
        ${p.date ? `<div class="item__meta">${p.author || ''} · ${new Date(p.date + 'T12:00').toLocaleDateString('pt-BR')}</div>` : ''}
      </a>`;
    $('list').innerHTML = `<div class="group">Referência</div>${items.filter((p) => p.slug === '__ds').map(row).join('')}
      <div class="group">Protótipos</div>${items.filter((p) => p.slug !== '__ds').map(row).join('') || '<div class="item__desc" style="padding:8px 10px">Nada encontrado.</div>'}`;
  }

  function fit() {
    const ph = document.querySelector('.phone'); if (!ph) return;
    const st = $('stage').getBoundingClientRect();
    const s = Math.min(1, (st.height - 56) / 878, (st.width - 40) / 419);
    ph.style.transform = `translate(-50%, -50%) scale(${s})`;
    $('scale').textContent = `393 × 852 · ${Math.round(s * 100)}%`;
  }

  function show() {
    const p = all.find((x) => x.slug === state.slug) || all[0];
    $('t').textContent = p.title; $('d').textContent = p.description || '';
    const url = urlOf(p, state.screen);
    $('open').href = url;
    $('screens').innerHTML = (p.screens || []).map((s) => `<button class="chip ${s === (state.screen || p.screens[1] || p.screens[0]) ? 'is-active' : ''}" data-s="${s}">${s}</button>`).join('');
    $('screens').style.display = p.screens ? '' : 'none';
    $('stage').innerHTML = p.wide
      ? `<div class="wide"><iframe src="${url}"></iframe></div>`
      : `<div class="phone"><iframe id="frame" src="${url}" title="${p.title}"></iframe></div><span class="scale-note" id="scale"></span>`;
    fit(); renderList();
    const qs = new URLSearchParams({ p: p.slug, ...(state.screen ? { s: state.screen } : {}) });
    history.replaceState(null, '', '?' + qs);
  }

  $('list').addEventListener('click', (e) => {
    const a = e.target.closest('[data-slug]'); if (!a) return;
    if (matchMedia('(max-width: 760px)').matches) { e.preventDefault(); const p = all.find((x) => x.slug === a.dataset.slug); location.href = urlOf(p); return; }
    e.preventDefault(); state = { slug: a.dataset.slug, screen: '' }; show();
  });
  $('screens').addEventListener('click', (e) => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    state.screen = b.dataset.s;
    const f = $('frame');
    if (f) { try { f.contentWindow.location.hash = '#/' + b.dataset.s; } catch (_) { f.src = urlOf(all.find((x) => x.slug === state.slug), state.screen); } }
    document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('is-active', c === b));
    $('open').href = urlOf(all.find((x) => x.slug === state.slug), state.screen);
    history.replaceState(null, '', `?p=${state.slug}&s=${state.screen}`);
  });
  $('reload').addEventListener('click', () => { const f = document.querySelector('.stage iframe'); if (f) f.src = f.src; });
  $('q').addEventListener('input', renderList);
  addEventListener('resize', fit);
  show();
</script>
</body>
</html>
